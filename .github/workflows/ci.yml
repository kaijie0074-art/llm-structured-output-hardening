name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 全量测试（含语料表驱动与评估阈值）
        run: mvn -B test
      - name: 评估落盘与工件自检
        run: |
          mvn -B -q compile dependency:build-classpath -Dmdep.outputFile=target/cp.txt
          java -cp "target/classes:$(cat target/cp.txt)" com.resumeai.Main eval fixtures/golden-resumes
          bash scripts/check_artifacts.sh
