name: ci
on:
  push:
    branches: [main, fix/hardening]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LSOH_API_KEY: ${{ secrets.LSOH_API_KEY }}
      LSOH_BASE_URL: ${{ secrets.LSOH_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 全量测试（含历史故障样本表驱动与评估阈值）
        run: mvn -B test
      - name: 工件自检
        run: |
          mvn -B -q compile dependency:build-classpath -Dmdep.outputFile=target/cp.txt
          bash scripts/check_artifacts.sh
      - name: 真实 LLM 评估落盘（有凭证时）
        if: env.LSOH_API_KEY != ''
        run: java -cp "target/classes:$(cat target/cp.txt)" com.resumeai.Main eval fixtures/golden-resumes
